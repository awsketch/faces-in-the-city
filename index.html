<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>berlin Kvetch</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============ CAMERA (QR codes open here: ?f=<figure-id>) ============ -->
  <section id="view-camera" class="view view--camera hidden" aria-label="Camera">
    <video id="camera-feed" autoplay playsinline muted></video>
    <img id="camera-overlay" class="cam-overlay" alt="" />

    <header class="cam-bar">
      <div class="cam-bar__title">
        <span class="brand-small">berlin <b>Kvetch</b></span>
        <span id="cam-figure-title" class="cam-bar__name"></span>
      </div>
      <button class="icon-btn icon-btn--light" data-go="collection" aria-label="Collection">
        <span class="material-symbols-outlined" aria-hidden="true">grid_view</span>
      </button>
    </header>

    <div id="cam-start" class="cam-start hidden">
      <p id="cam-start-msg">Camera access is needed to find the figure.</p>
      <button id="cam-start-btn" class="btn btn--light">Start camera</button>
    </div>

    <footer class="cam-foot">
      <p class="cam-foot__hint">Line the drawing up with the spot.</p>
      <div class="cam-foot__row">
        <span class="label-caps"><span id="align-status">Starting camera…</span> · <span id="align-score">0%</span></span>
        <span class="cam-foot__actions">
          <a id="cam-listen" class="btn btn--light btn--small hidden" href="#listen">Listen</a>
          <!-- TEMPORARY: manual unlock until camera matching is proven in the field -->
          <button id="manual-unlock" class="btn btn--light btn--small">Unlock</button>
        </span>
      </div>
    </footer>
  </section>

  <!-- ============ PLAYER ============ -->
  <section id="view-player" class="view view--player hidden" aria-label="Player">
    <header class="masthead">
      <span class="masthead__brand">berlin <b>Kvetch</b></span>
      <button class="icon-btn" data-go="collection" aria-label="Collection">
        <span class="material-symbols-outlined" aria-hidden="true">grid_view</span>
      </button>
    </header>

    <div id="unlocked-flash" class="flash hidden"><span class="label-caps">Unlocked</span></div>

    <div class="player-stage">
      <img id="player-drawing" class="player-stage__img" alt="" />
    </div>

    <div class="player-meta">
      <h1 id="player-title" class="player-meta__title"></h1>
      <p id="player-subtitle" class="label-caps player-meta__sub"></p>
    </div>

    <div class="player">
      <audio id="audio" preload="metadata"></audio>
      <div class="player__progress">
        <span id="t-cur" class="player__time">0:00</span>
        <input id="seek" class="player__seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek" />
        <span id="t-tot" class="player__time">0:00</span>
      </div>
      <div class="player__controls">
        <button id="back-10" class="player__skip" aria-label="Back 10 seconds">
          <span class="material-symbols-outlined" aria-hidden="true">replay_10</span>
        </button>
        <button id="play-pause" class="player__play" aria-label="Play">
          <span id="icon-play" class="material-symbols-outlined" aria-hidden="true">play_circle</span>
          <span id="icon-pause" class="material-symbols-outlined hidden" aria-hidden="true">pause_circle</span>
        </button>
        <button id="fwd-10" class="player__skip" aria-label="Forward 10 seconds">
          <span class="material-symbols-outlined" aria-hidden="true">forward_10</span>
        </button>
      </div>
      <p id="audio-missing" class="label-caps muted hidden">Audio not added yet</p>
    </div>
  </section>

  <!-- ============ COLLECTION (the only other screen) ============ -->
  <section id="view-collection" class="view view--collection hidden" aria-label="Collection">
    <header class="masthead masthead--sticky">
      <h1 class="masthead__brand">berlin <b>Kvetch</b></h1>
      <span class="masthead__end">
        <span id="coll-count" class="label-caps"></span>
        <button id="coll-back" class="icon-btn hidden" aria-label="Back">
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      </span>
    </header>

    <ul id="coll-grid" class="coll-grid"></ul>

    <p class="coll-foot">Find a card. Find the spot. Scan the code.</p>
  </section>

  <script src="js/alignment.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
