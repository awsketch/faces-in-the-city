<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="noindex" />
  <title>berlin Kvetch — Find</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* find.html only: overlay starts invisible and fades in with the match score */
    #view-find .cam-overlay { opacity: 0; transition: opacity .35s ease; }
    .find-bar-meter { height: 2px; background: rgba(255,255,255,.25); margin-top: 12px; }
    .find-bar-meter > i { display: block; height: 100%; width: 0; background: var(--paper); transition: width .3s ease; }

    /* frozen frame at the moment of capture (and the stand-in photo in ?celebrate preview) */
    #camera-still { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; }

    /* ---------- Capture ceremony ----------
       1. is-capturing: frame freezes, bars slide away, the scene goes dark,
          the figure ignites as glowing white lines
       2. is-bloom:     solid white grows out of the figure until it fills the screen
       3. is-white:     name of the figure on white, then the player opens (also white) */
    .cam-bar, .cam-foot { transition: transform .55s cubic-bezier(.6, 0, .2, 1); }
    .is-capturing .cam-bar { transform: translateY(-100%); }
    .is-capturing .cam-foot { transform: translateY(100%); }
    #camera-feed, #camera-still { transition: filter .8s ease; }
    .is-capturing #camera-feed, .is-capturing #camera-still { filter: grayscale(1) brightness(.28) contrast(1.15); }
    .is-capturing #camera-overlay { opacity: 0 !important; transition: opacity .2s ease; }

    .capture { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    #view-find .capture__fig { opacity: 0; filter: none; }
    .is-capturing .capture__fig { animation: fig-ignite 1.15s cubic-bezier(.2, .7, .2, 1) forwards; }
    @keyframes fig-ignite {
      0%   { opacity: .5; transform: scale(var(--fig-scale, 1));
             filter: invert(1) drop-shadow(0 0 0 #fff) drop-shadow(0 0 0 #fff) drop-shadow(0 0 0 #fff); }
      30%  { opacity: 1;
             filter: invert(1) drop-shadow(0 0 2px #fff) drop-shadow(0 0 10px #fff) drop-shadow(0 0 0 #fff); }
      100% { opacity: 1; transform: scale(calc(var(--fig-scale, 1) * 1.06));
             filter: invert(1) drop-shadow(0 0 4px #fff) drop-shadow(0 0 18px #fff) drop-shadow(0 0 44px #fff); }
    }
    .capture__white {
      position: absolute; inset: 0; background: var(--paper);
      clip-path: circle(0 at var(--cx, 50%) var(--cy, 50%));
    }
    .is-bloom .capture__white {
      clip-path: circle(160vmax at var(--cx, 50%) var(--cy, 50%));
      transition: clip-path .8s cubic-bezier(.7, 0, .3, 1);
    }
    .capture__card {
      position: absolute; left: var(--margin); right: var(--margin); bottom: calc(56px + var(--safe-bottom));
      display: flex; flex-direction: column; gap: 12px; color: var(--ink);
      opacity: 0; transform: translateY(16px);
    }
    .is-white .capture__card { opacity: 1; transform: none; transition: opacity .5s ease, transform .6s cubic-bezier(.2, .7, .2, 1); }
    .capture__name { font: 700 clamp(44px, 13vw, 80px)/.95 var(--font-display); letter-spacing: -.03em; }
    @media (prefers-reduced-motion: reduce) {
      .is-capturing .capture__fig { animation-duration: .3s; }
      .is-bloom .capture__white { clip-path: none; transition: none; animation: fade-white .3s ease both; }
      @keyframes fade-white { from { opacity: 0; } to { opacity: 1; } }
    }
  </style>
</head>
<body data-view="camera">

  <!-- Preview of the capture moment without being on the spot: find.html?celebrate=sad-lego -->
  <!-- TEST PAGE: no QR code. GPS narrows down the figures, feature-point
       matching on the camera picks one, its drawing fades in, a solid match unlocks. -->
  <section id="view-find" class="view view--camera" aria-label="Find a figure">
    <video id="camera-feed" autoplay playsinline muted></video>
    <img id="camera-still" class="hidden" alt="" />
    <img id="camera-overlay" class="cam-overlay" alt="" />

    <header class="cam-bar">
      <div class="cam-bar__title">
        <span class="brand-small">berlin <b>Kvetch</b></span>
        <span id="find-title" class="cam-bar__name">Looking around…</span>
      </div>
      <a class="icon-btn icon-btn--light" href="./" aria-label="Close camera">
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
      </a>
    </header>

    <div id="find-start" class="cam-start">
      <p id="find-start-msg">Stand where you think a figure hides, then start. The camera and your location are used on this phone only.</p>
      <button id="find-start-btn" class="btn btn--light">Start camera</button>
    </div>

    <!-- capture ceremony (see the CSS above and capture() in find.js) -->
    <div id="capture" class="capture hidden" aria-live="assertive">
      <img id="capture-fig" class="cam-overlay capture__fig" alt="" />
      <div class="capture__white"></div>
      <div class="capture__card">
        <span class="label-caps">Found</span>
        <span id="capture-name" class="capture__name"></span>
      </div>
    </div>

    <footer class="cam-foot">
      <p id="find-hint" class="cam-foot__hint">Point the camera at the spot.</p>
      <div class="cam-foot__row">
        <span class="label-caps"><span id="find-status">Waiting</span> · <span id="find-score">0%</span></span>
        <!-- TEMPORARY: manual unlock while the find flow is being tested -->
        <button id="manual-unlock" class="btn btn--light btn--small">Unlock</button>
      </div>
      <div class="find-bar-meter"><i id="find-meter"></i></div>
    </footer>
  </section>

  <script src="js/matcher.js"></script>
  <script src="js/find.js"></script>
</body>
</html>
