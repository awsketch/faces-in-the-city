<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Faces in the City</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="sketch-page" class="frame sketch-page">

    <header class="masthead">
      <a href="index.html" class="masthead__brand">FITC</a>
      <span class="label-caps masthead__meta">
        <span>The Index</span>
      </span>
    </header>

    <header class="sketch-page__header">
      <a href="index.html" class="back" aria-label="Back to list">← Index</a>
      <h1 id="sketch-title">Loading…</h1>
    </header>

    <!-- LOCKED STATE -->
    <section id="view-locked" class="view">
      <div class="lock-card">
        <span class="lock-card__icon" aria-hidden="true">[ Locked ]</span>
        <p id="sketch-subtitle" class="lock-card__subtitle"></p>
        <p class="lock-card__hint">
          Stand in front of the spot, point your camera at the building, and align
          the outline with what you see. The sketch unlocks when they match.
        </p>
        <div>
          <button id="open-camera" class="primary">Open camera</button>
        </div>
      </div>
    </section>

    <!-- CAMERA / ALIGNMENT STATE -->
    <section id="view-camera" class="view view--camera hidden">
      <div class="camera-stage">
        <video id="camera-feed" autoplay playsinline muted></video>
        <img id="camera-overlay" class="overlay" alt="" />
        <div class="alignment-readout">
          <span id="alignment-status">Looking for alignment…</span>
          <span id="alignment-confidence">0%</span>
        </div>
      </div>
      <div class="camera-controls">
        <button id="close-camera" class="ghost">Cancel</button>
        <button id="manual-unlock" class="primary">Unlock</button>
      </div>
      <p id="camera-error" class="error hidden"></p>
    </section>

    <!-- UNLOCKED STATE -->
    <section id="view-unlocked" class="view hidden">
      <div class="sketch-frame">
        <img id="full-sketch" alt="" />
      </div>

      <div class="player" id="player">
        <audio id="audio-player" preload="metadata"></audio>

        <div class="player__progress">
          <span id="time-current" class="player__time">0:00</span>
          <input id="seek" class="player__seek" type="range"
                 min="0" max="100" step="0.1" value="0"
                 aria-label="Seek" />
          <span id="time-total" class="player__time">0:00</span>
        </div>

        <div class="player__controls">
          <!-- Back 10 seconds — full circular arc, integrated chevron arrowhead, big "10" -->
          <button id="back-10" class="player__skip" aria-label="Back 10 seconds">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <!-- ~350° circular arc (radius 11), CCW with tiny gap at top -->
              <path d="M 17 5.07 A 11 11 0 1 0 15 5.07"
                    stroke-width="1.25" stroke-linecap="round" />
              <!-- Chevron arrowhead at the gap, tip pointing back (left) -->
              <polyline points="17.5,2.4 15,5.07 17.5,7.7"
                        stroke-width="1.25" stroke-linejoin="miter" />
              <!-- Big bold "10" -->
              <text x="16" y="21" text-anchor="middle"
                    font-family="Inter, sans-serif"
                    font-size="13" font-weight="700">10</text>
            </svg>
          </button>

          <!-- Play / Pause -->
          <button id="play-pause" class="player__play" aria-label="Play" aria-pressed="false">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <!-- Thin enclosing circle -->
              <circle cx="16" cy="16" r="15" stroke-width="1.25" />
              <!-- Sharp play triangle, outline only -->
              <polygon id="icon-play" points="13,10 13,22 23,16"
                       stroke-width="1.5" stroke-linejoin="miter" />
              <!-- Pause bars as thin lines -->
              <g id="icon-pause" class="hidden">
                <line x1="13" y1="10" x2="13" y2="22" stroke-width="1.5" stroke-linecap="square" />
                <line x1="19" y1="10" x2="19" y2="22" stroke-width="1.5" stroke-linecap="square" />
              </g>
            </svg>
          </button>

          <!-- Forward 10 seconds — mirror of back-10 -->
          <button id="forward-10" class="player__skip" aria-label="Forward 10 seconds">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <!-- ~350° circular arc (radius 11), CW with tiny gap at top -->
              <path d="M 15 5.07 A 11 11 0 1 1 17 5.07"
                    stroke-width="1.25" stroke-linecap="round" />
              <!-- Chevron arrowhead at the gap, tip pointing forward (right) -->
              <polyline points="14.5,2.4 17,5.07 14.5,7.7"
                        stroke-width="1.25" stroke-linejoin="miter" />
              <!-- Big bold "10" -->
              <text x="16" y="21" text-anchor="middle"
                    font-family="Inter, sans-serif"
                    font-size="13" font-weight="700">10</text>
            </svg>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/alignment.js"></script>
  <script src="js/sketch.js"></script>
</body>
</html>
