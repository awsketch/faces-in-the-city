<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Berlin Kvetch Cards</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700&family=Inter:wght@400;600&display=swap" />
  <style>
    /* Print sheet for the physical cards: 63 × 88 mm, 3 × 3 per A4 page.
       Print on transparency film — white areas stay clear. */
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #000; font: 14px/1.4 'Inter', Arial, sans-serif; }
    .controls { padding: 24px; border-bottom: 1px solid #000; display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    .controls label { display: flex; flex-direction: column; gap: 4px; font: 600 12px 'Inter'; letter-spacing: .1em; text-transform: uppercase; }
    .controls input { font: inherit; padding: 8px; border: 2px solid #000; border-radius: 0; width: min(420px, 80vw); }
    .controls button { font: 600 12px 'Inter'; letter-spacing: .1em; text-transform: uppercase; padding: 12px 20px; border: 2px solid #000; background: #fff; border-radius: 0; cursor: pointer; }
    .controls button:hover { background: #000; color: #fff; }
    .controls p { margin: 0; width: 100%; color: #4c4546; }

    .sheet { display: flex; flex-wrap: wrap; gap: 0; padding: 24px; }
    .card {
      width: 63mm; height: 88mm;
      border: .2mm dashed #999; /* cut guide */
      padding: 4mm;
      display: flex; flex-direction: column;
      break-inside: avoid;
    }
    .card__drawing { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .card__drawing img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .card__title { font: 700 5mm/1 'Epilogue', Arial; letter-spacing: -.02em; text-transform: uppercase; margin: 2mm 0; }
    .card__row { display: flex; gap: 2.5mm; height: 24mm; border-top: .3mm solid #000; padding-top: 2.5mm; }
    .card__map { flex: 1; border: .3mm solid #000; position: relative; overflow: hidden; }
    .card__map .leaflet-tile-pane { filter: grayscale(1) contrast(1.2); }
    .card__map .leaflet-control-attribution { font-size: 4px; padding: 0 1px; background: rgba(255,255,255,.8); }
    .card__nomap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 2.4mm; padding: 1mm; color: #4c4546; }
    .card__qr { width: 21.5mm; height: 21.5mm; }
    .card__qr svg { width: 100%; height: 100%; display: block; }

    @page { size: A4; margin: 10mm; }
    @media print {
      .controls { display: none; }
      .sheet { padding: 0; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <label>App address (what the QR codes open)
      <input id="base" type="url" />
    </label>
    <button id="apply">Update codes</button>
    <button onclick="window.print()">Print</button>
    <p>Each QR opens <code>&lt;address&gt;?f=&lt;figure&gt;</code> straight into the camera. Set lat/lng in each figure's meta.json for the map. Not linked from the app.</p>
  </div>
  <div id="sheet" class="sheet"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    (async function () {
      const baseInput = document.getElementById('base');
      const defaultBase = location.origin + location.pathname.replace(/cards\.html$/, '');
      baseInput.value = localStorageGet('bk.cards.base') || defaultBase;

      const res = await fetch('figures/index.json', { cache: 'no-cache' });
      const { figures = [] } = await res.json();
      const sheet = document.getElementById('sheet');

      for (const f of figures) {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="card__drawing">${f.drawing ? `<img src="${encodeURI(f.drawing)}" alt="">` : ''}</div>
          <div class="card__title"></div>
          <div class="card__row">
            <div class="card__map"></div>
            <div class="card__qr" data-id="${f.id}"></div>
          </div>`;
        card.querySelector('.card__title').textContent = f.title;
        sheet.appendChild(card);

        const mapEl = card.querySelector('.card__map');
        const { lat, lng } = f.location || {};
        if (typeof lat === 'number' && typeof lng === 'number') {
          const map = L.map(mapEl, { zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false })
            .setView([lat, lng], 17);
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
          L.circleMarker([lat, lng], { radius: 4, color: '#000', weight: 2, fillColor: '#000', fillOpacity: 1 }).addTo(map);
        } else {
          mapEl.innerHTML = '<div class="card__nomap">Add lat / lng to meta.json</div>';
        }
      }

      function drawCodes() {
        let base = baseInput.value.trim();
        if (base && !base.endsWith('/')) base += '/';
        localStorageSet('bk.cards.base', base);
        document.querySelectorAll('.card__qr').forEach((el) => {
          const qr = qrcode(0, 'M');
          qr.addData(`${base}?f=${encodeURIComponent(el.dataset.id)}`);
          qr.make();
          el.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
        });
      }
      document.getElementById('apply').addEventListener('click', drawCodes);
      drawCodes();

      function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
      function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
    })();
  </script>
</body>
</html>
